[pytest]
# Pytest configuration for SIADIK application tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Add markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may use database)
    auth: Authentication tests
    slow: Slow tests that may timeout
    security: Security-related tests

# Output options
addopts =
    -v
    --strict-markers
    --disable-warnings
    --tb=short
    -ra

# Timeout for slow tests
timeout = 300

# Coverage options
testpaths = .

# Ignore patterns
norecursedirs = venv .git node_modules __pycache__
